{% extends 'layouts/base.html'%}

{% block body %}
<section class="container bg-white mx-auto m-3 p-4 rounded-3 shadow-sm" style="max-width: 640px;">
    <div class="page-header">
        <div class="page-header-title">
            <span class="page-header-icon bg-danger bg-opacity-10 text-danger"><i class="fas fa-ban"></i></span>
            <h1>Blacklist {{ citizen }}</h1>
        </div>
        <div class="page-header-actions">
            <a href="{% url 'citizen-detail' citizen.pk %}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i>Back
            </a>
        </div>
    </div>

    <p class="text-muted">ID Number: <strong>{{ citizen.id_number }}</strong></p>

    <form method="post" id="driver-blacklist" class="form-card">
        {% csrf_token %}
        {% include 'layouts/form_fields.html' %}
        <button type="submit" class="btn btn-danger">
            <i class="fas fa-ban me-1"></i>Blacklist Driver
        </button>
    </form>
</section>
{% endblock %}
