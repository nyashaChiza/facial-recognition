{% extends 'layouts/base.html'%}

{% block body %}
<section class="container bg-white mx-auto m-3 p-4 rounded-3 shadow-sm">
    <div class="page-header">
        <div class="page-header-title">
            <span class="page-header-icon"><i class="fas fa-user-plus"></i></span>
            <h1>Add Driver</h1>
        </div>
        <div class="page-header-actions">
            <a href="{% url 'citizen-list' %}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i>Back
            </a>
        </div>
    </div>

    <form method="post" action="{% url 'driver-create' %}" id="driver-form" enctype="multipart/form-data" class="form-card">
        {% csrf_token %}
        {% include 'layouts/form_fields.html' %}

        <div class="capture-box mb-3">
            <video id="video" autoplay playsinline></video>
            <p class="capture-hint"><i class="fas fa-camera me-1"></i>Position the driver's face in frame, then capture.</p>
            <button class="btn btn-success" type="button" id="capture-btn">
                <i class="fas fa-camera me-1"></i>Capture Face and Submit
            </button>
        </div>

        <script>
            document.getElementById('capture-btn').addEventListener('click', function() {
                const video = document.getElementById('video');
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg');

                // Assign the captured image data to a hidden input field in the form
                const imageInput = document.createElement('input');
                imageInput.type = 'hidden';
                imageInput.name = 'image_data';
                imageInput.value = imageData;
                document.getElementById('driver-form').appendChild(imageInput);

                // Submit the form
                document.getElementById('driver-form').submit();
            });

            // Get access to the webcam
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                })
                .catch(err => {
                    console.error('Error accessing webcam:', err);
                });
        </script>
    </form>
</section>
{% endblock %}
